APPS.terminal.render = function (w) {
    w.body.className = 'wbody flush';
    w.body.innerHTML = '<div class="term" id="term"></div>';
    const t = w.body.querySelector('#term');
    let cwd = ['Desktop'];
    const hist = []; let hi = -1;
    function prompt() { return 'C:\\Users\\' + G.name + '\\' + cwd.join('\\') + '>'; }
    function print(s, cls) { const d = el('div', cls || '', esc(s)); t.insertBefore(d, t.lastChild); t.scrollTop = t.scrollHeight; }
    function line() {
        const row = el('div', 'in', '<span>' + esc(prompt()) + ' </span><input type="text" spellcheck="false" autocomplete="off">');
        t.appendChild(row);
        const inp = row.querySelector('input');
        inp.onkeydown = function (e) {
            if (e.key === 'Enter') { const v = inp.value; inp.disabled = true; hist.push(v); hi = hist.length; run(v); }
            if (e.key === 'ArrowUp') { if (hi > 0) { hi--; inp.value = hist[hi]; } e.preventDefault(); }
            if (e.key === 'ArrowDown') { if (hi < hist.length - 1) { hi++; inp.value = hist[hi]; } else { hi = hist.length; inp.value = ''; } e.preventDefault(); }
        };
        if (!isTouch()) inp.focus();
        t.scrollTop = t.scrollHeight;
    }
    function run(cmdline) {
        const parts = cmdline.trim().split(/\s+/), cmd = (parts[0] || '').toLowerCase(), arg = parts.slice(1).join(' ');
        const out = [];
        const list = getDir(cwd) || [];
        switch (cmd) {
            case '': break;
            case 'help': out.push('For more information on a specific command, type HELP command-name.', 'CD       Displays the name of or changes the current directory.', 'CLS      Clears the screen.', 'COLOR    Sets the default console colours.', 'DATE     Displays the date.', 'DIR      Displays a list of files and subdirectories in a directory.', 'ECHO     Displays messages.', 'EXIT     Quits the Terminal.', 'MKDIR    Creates a directory.', 'START    Starts an app (notepad, calc, paint, edge, settings…).', 'TIME     Displays the system time.', 'TYPE     Displays the contents of a text file.', 'VER      Displays the Windows version.', 'WHOAMI   Displays the current user.'); break;
            case 'cls': t.innerHTML = ''; break;
            case 'ver': out.push('', 'Microsoft Windows [Version 10.0.26100.1]'); break;
            case 'whoami': out.push('andy-pc\\' + G.name.toLowerCase()); break;
            case 'date': out.push('The current date is: ' + new Date().toDateString()); break;
            case 'time': out.push('The current time is: ' + new Date().toTimeString().slice(0, 8)); break;
            case 'echo': out.push(arg || 'ECHO is on.'); break;
            case 'color': t.style.background = arg.indexOf('1') === 0 ? '#012456' : arg.indexOf('2') === 0 ? '#063d18' : '#0c0c0c'; t.style.color = arg.slice(1) === 'a' ? '#4cff4c' : arg.slice(1) === 'e' ? '#ffff55' : '#ccc'; break;
            case 'dir':
                out.push(' Volume in drive C is Windows', ' Directory of ' + prompt().slice(0, -1), '');
                list.forEach(function (f) { out.push(fmtDate(f.m).padEnd(22) + (f.k === 'dir' ? '<DIR>          ' : '               ') + f.n); });
                out.push('', '               ' + list.filter(function (f) { return f.k !== 'dir'; }).length + ' File(s)', '               ' + list.filter(function (f) { return f.k === 'dir'; }).length + ' Dir(s)   412,733,829,120 bytes free');
                break;
            case 'cd': case 'chdir':
                if (!arg) { out.push(prompt().slice(0, -1)); break; }
                if (arg === '..') { if (cwd.length > 1) cwd.pop(); break; }
                if (arg === '\\' || arg === '/') { cwd = ['Desktop']; break; }
                if (ROOTS.indexOf(arg) >= 0) { cwd = [arg]; break; }
                if (list.some(function (f) { return f.k === 'dir' && f.n.toLowerCase() === arg.toLowerCase(); })) { cwd.push(list.find(function (f) { return f.k === 'dir' && f.n.toLowerCase() === arg.toLowerCase(); }).n); break; }
                out.push({ s: 'The system cannot find the path specified.', c: 'err' }); break;
            case 'mkdir': case 'md':
                if (!arg) { out.push({ s: 'The syntax of the command is incorrect.', c: 'err' }); break; }
                addFile(cwd, { n: arg.replace(/[\\/:*?"<>|]/g, ''), k: 'dir', items: [] }); break;
            case 'type': {
                const f = list.find(function (x) { return x.n.toLowerCase() === arg.toLowerCase(); });
                if (!f) out.push({ s: 'The system cannot find the file specified.', c: 'err' });
                else if (f.k !== 'txt') out.push({ s: 'Not a text file.', c: 'err' });
                else out.push(f.t || '');
                break;
            }
            case 'start': {
                const k = Object.keys(APPS).find(function (a) { return a === arg.toLowerCase() || APPS[a].name.toLowerCase() === arg.toLowerCase(); });
                if (k && appAvailable(k)) { openWin(k); out.push({ s: 'Started ' + APPS[k].name + '.', c: 'ok' }); }
                else out.push({ s: "'" + arg + "' is not recognized as an app.", c: 'err' });
                break;
            }
            case 'exit': closeWin(w.key); return;
            case 'shutdown': shutDown(); return;
            case 'tree': out.push('C:.'); ROOTS.forEach(function (r) { out.push('├───' + r); G.fs[r].forEach(function (f) { out.push('│   ' + (f.k === 'dir' ? '└───' : '    ') + f.n); }); }); break;
            case 'ping': out.push('Pinging ' + (arg || 'localhost') + ' with 32 bytes of data:', 'Reply from 127.0.0.1: bytes=32 time<1ms TTL=128', 'Reply from 127.0.0.1: bytes=32 time<1ms TTL=128', '', 'Ping statistics: Packets: Sent = 2, Received = 2, Lost = 0 (0% loss)'); break;
            case 'ipconfig': out.push('', 'Windows IP Configuration', '', 'Wireless LAN adapter Wi-Fi:', '', '   IPv4 Address. . . . . . . . . . . : 192.168.1.42', '   Subnet Mask . . . . . . . . . . . : 255.255.255.0', '   Default Gateway . . . . . . . . . : 192.168.1.1'); break;
            case 'neofetch': case 'winver': out.push('  Andy-PC', '  OS: Windows 11 Home (browser edition)', '  Host: Play Centre', '  CPU: Intel i9-14900KF (16) @ 6.0GHz', '  GPU: NVIDIA GeForce RTX 5090', '  Memory: 16 GB', '  Shell: Terminal'); break;
            default: out.push({ s: "'" + parts[0] + "' is not recognized as an internal or external command,\noperable program or batch file.", c: 'err' });
        }
        out.forEach(function (o) { const d = el('div', typeof o === 'object' ? o.c : '', esc(typeof o === 'object' ? o.s : o)); t.appendChild(d); });
        t.appendChild(el('div', '', ' '));
        line();
    }
    t.appendChild(el('div', '', 'Microsoft Windows [Version 10.0.26100.1]'));
    t.appendChild(el('div', '', '(c) Microsoft Corporation. All rights reserved. Type "help" to get started.'));
    t.appendChild(el('div', '', ' '));
    line();
    t.onclick = function () { const inp = t.querySelector('.in:last-child input'); if (inp && !window.getSelection().toString()) inp.focus(); };
};

    playcentre: { t: 'Play Centre', url: 'playcentre.local', src: './' },

APPS.edge.render = function (w) {
    const st = w.state;
    if (!st.tabs) { st.tabs = [{ hist: ['newtab'], hi: 0 }]; st.ti = 0; }
    if (w.arg && w.arg.site) { st.tabs.push({ hist: [w.arg.site], hi: 0 }); st.ti = st.tabs.length - 1; w.arg = {}; }
    function cur() { return st.tabs[st.ti]; }
    function page() { return cur().hist[cur().hi]; }
    function titleOf(p) { if (p === 'newtab') return 'New tab'; if (p.indexOf('search:') === 0) return p.slice(7) + ' - Search'; if (SITES[p]) return SITES[p].t; return 'Can\'t reach this page'; }
    function urlOf(p) { if (p === 'newtab') return ''; if (p.indexOf('search:') === 0) return 'bing.com/search?q=' + encodeURIComponent(p.slice(7)); if (SITES[p]) return SITES[p].url; return p.replace(/^url:/, ''); }
    function go(p) { const t = cur(); t.hist = t.hist.slice(0, t.hi + 1); t.hist.push(p); t.hi++; draw(); }
    function nav(input) {
        const v = input.trim();
        if (!v) return;
        const low = v.toLowerCase().replace(/^https?:\/\//, '');
        const hit = Object.keys(SITES).find(function (k) { return low === SITES[k].url || low === k || low === SITES[k].t.toLowerCase(); });
        if (hit) return go(hit);
        if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(low) || low.indexOf('localhost') === 0) return go('url:' + low);
        go('search:' + v);
    }
    function draw() {
        const p = page();
        setTitle(w, titleOf(p) + ' - Microsoft Edge');
        w.body.className = 'wbody flush';
        let html = '<div class="br-top"><div class="br-tabs">' + st.tabs.map(function (t, i) { const tp = t.hist[t.hi]; return '<button class="br-tab' + (i === st.ti ? ' on' : '') + '" data-i="' + i + '">' + iconBox(tp === 'newtab' ? 'edge' : SITES[tp] ? 'playcentre' : 'search') + '<span>' + esc(titleOf(tp)) + '</span><span class="tx" data-x="' + i + '">✕</span></button>'; }).join('') + '<button class="br-newtab" id="br-new">+</button></div>' +
            '<div class="br-bar"><button class="nb" id="br-back"' + (cur().hi > 0 ? '' : ' disabled') + '>' + GL.back + '</button><button class="nb" id="br-fwd"' + (cur().hi < cur().hist.length - 1 ? '' : ' disabled') + '>' + GL.fwd + '</button><button class="nb" id="br-reload">' + GL.refresh + '</button><button class="nb" id="br-home">' + GL.home + '</button>' +
            '<div class="br-url">' + GL.lock + '<input id="br-in" type="text" value="' + esc(urlOf(p)) + '" placeholder="Search or enter web address" autocomplete="off" spellcheck="false"></div><button class="nb" id="br-star" title="Add to favourites">' + GL.star + '</button></div></div><div class="br-page" id="br-page"></div>';
        w.body.innerHTML = html;
        const pg = w.body.querySelector('#br-page');
        if (p === 'newtab') {
            pg.innerHTML = '<div class="ntp"><div class="logo">' + iconBox('edge') + 'Microsoft Edge</div><div class="ntp-search">' + GL.search + '<input id="ntp-q" type="text" placeholder="Search the web" autocomplete="off"></div>' +
                '<div class="ntp-links">' + Object.keys(SITES).map(function (k) { return '<button class="ntp-link" data-s="' + k + '">' + iconBox(k === 'playcentre' ? 'playcentre' : 'game') + esc(SITES[k].t) + '</button>'; }).join('') + '</div>' +
                '<p style="color:var(--txt2);font-size:12px;max-width:520px;text-align:center;">This browser only knows about the Play Centre. Other websites will not load, because the PC is not really connected to anything.</p></div>';
            pg.querySelector('#ntp-q').onkeydown = function (e) { if (e.key === 'Enter') nav(this.value); };
            pg.querySelectorAll('.ntp-link').forEach(function (b) { b.onclick = function () { go(b.dataset.s); }; });
        } else if (p.indexOf('search:') === 0) {
            const q = p.slice(7), ql = q.toLowerCase();
            const hits = Object.keys(SITES).filter(function (k) { return SITES[k].t.toLowerCase().indexOf(ql) >= 0 || ql.indexOf('game') >= 0 || ql.indexOf('play') >= 0; });
            pg.innerHTML = '<div class="serp"><div class="stat">About ' + (hits.length || 1) + ' results (0.0' + (3 + q.length % 6) + ' seconds) for <b>' + esc(q) + '</b></div>' +
                (hits.length ? hits.map(function (k) { return '<div class="r"><div class="u">https://' + esc(SITES[k].url) + '</div><div class="t" data-s="' + k + '">' + esc(SITES[k].t) + ' — Play Centre</div><div class="s">Free browser game, no download needed. Just your browser!</div></div>'; }).join('') :
                '<div class="r"><div class="u">https://www.bing.com</div><div class="t">No results for "' + esc(q) + '"</div><div class="s">The only thing on this PC\'s internet is the Play Centre. Try searching for "games".</div></div>') + '</div>';
            pg.querySelectorAll('.t[data-s]').forEach(function (b) { b.onclick = function () { go(b.dataset.s); }; });
        } else if (SITES[p]) {
            pg.innerHTML = '<iframe src="' + SITES[p].src + '" title="' + esc(SITES[p].t) + '" allow="autoplay"></iframe>';
        } else {
            pg.innerHTML = '<div class="errpage"><div class="face">🌐</div><h2>Hmmm… can\'t reach this page</h2><p><b>' + esc(urlOf(p)) + '</b> took too long to respond.</p><p>Try checking the connection. This PC only reaches the Play Centre.</p><code>ERR_CONNECTION_TIMED_OUT</code></div>';
        }
        w.body.querySelectorAll('.br-tab').forEach(function (b) { b.onclick = function (e) { if (e.target.dataset.x !== undefined) { closeTab(+e.target.dataset.x); return; } st.ti = +b.dataset.i; draw(); }; });
        w.body.querySelector('#br-new').onclick = function () { st.tabs.push({ hist: ['newtab'], hi: 0 }); st.ti = st.tabs.length - 1; draw(); };
        w.body.querySelector('#br-back').onclick = function () { cur().hi--; draw(); };
        w.body.querySelector('#br-fwd').onclick = function () { cur().hi++; draw(); };
        w.body.querySelector('#br-reload').onclick = draw;
        w.body.querySelector('#br-home').onclick = function () { go('newtab'); };
        w.body.querySelector('#br-star').onclick = function () { toast('edge', 'Added to favourites', titleOf(p), 2500, 'Microsoft Edge'); };

        inp.onkeydown = function (e) { if (e.key === 'Enter') nav(inp.value); };
        inp.onfocus = function () { inp.select(); };

        PALETTE.map(function (c) { return '<button class="sw' + (c === '#000000' ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '" title="' + c + '"></button>'; }).join('') +
        '<input type="color" id="pt-col" value="#000000" title="Custom colour"><span class="sepv"></span><button class="tl" id="pt-clear" title="Clear">' + GL.bin + '</button><button class="tl" id="pt-save" title="Save to Pictures">' + GL.save + '</button><button class="tl" id="pt-wp" title="Set as desktop background">' + GL.image + '</button></div>' +
        '<div class="pt-wrap"><canvas id="pt-cv" width="960" height="600"></canvas></div>';
    const cv = w.body.querySelector('#pt-cv'), ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    function fit() { const wrap = w.body.querySelector('.pt-wrap'); const s = Math.min(1, (wrap.clientWidth - 28) / cv.width); cv.style.width = Math.round(cv.width * s) + 'px'; cv.style.height = Math.round(cv.height * s) + 'px'; }
    fit(); w.onResize = fit;
    function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
    function stroke(a, b) { ctx.strokeStyle = st.tool === 'eraser' ? '#fff' : st.col; ctx.lineWidth = st.size; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    function shape(a, b) {
        ctx.putImageData(st.snap, 0, 0);
        ctx.strokeStyle = st.col; ctx.lineWidth = st.size; ctx.beginPath();
        if (st.tool === 'line') { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
        else if (st.tool === 'rect') ctx.rect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
        else ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
    function fill(p) {
        const img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data, W = cv.width, H = cv.height;
        const x0 = p.x | 0, y0 = p.y | 0, i0 = (y0 * W + x0) * 4;
        const tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
        const c = st.col, nr = parseInt(c.slice(1, 3), 16), ng = parseInt(c.slice(3, 5), 16), nb = parseInt(c.slice(5, 7), 16);
        if (tr === nr && tg === ng && tb === nb) return;
        const stack = [x0, y0];
        while (stack.length) {
            const y = stack.pop(), x = stack.pop();
            let i = (y * W + x) * 4;
            if (x < 0 || y < 0 || x >= W || y >= H) continue;
            if (Math.abs(d[i] - tr) > 24 || Math.abs(d[i + 1] - tg) > 24 || Math.abs(d[i + 2] - tb) > 24) continue;
            d[i] = nr; d[i + 1] = ng; d[i + 2] = nb; d[i + 3] = 255;

        }

    w.body.querySelector('#pt-col').oninput = function () { st.col = this.value; w.body.querySelectorAll('.sw').forEach(function (x) { x.classList.remove('on'); }); };
    w.body.querySelector('#pt-size').oninput = function () { st.size = +this.value; };
    w.body.querySelector('#pt-clear').onclick = function () { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); };

        dialog({ title: 'Save as', text: 'Picture name (saved to Pictures)', input: st.name || 'Untitled.png', buttons: [{ t: 'Save', primary: true, fn: function (v) {
            v = String(v || '').replace(/[\\/:*?"<>|]/g, '').trim();

            st.name = f.n; st.dirty = false;
            setTitle(w, f.n + ' - Paint');

        } }, { t: 'Cancel' }] });
    }

    };
    setTitle(w, 'Untitled - Paint');

    function fmt(ms) { const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, c = Math.floor(ms / 10) % 100; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0'); }
    function tick() {
        if (!WINS[w.key]) return;
        const t = st.acc + (st.run ? performance.now() - st.t0 : 0);

                pane.appendChild(el('div', 'card', '<div class="row"><div><div>Output</div><small>Speakers (Realtek High Definition Audio)</small></div><button class="btn sm" id="st-test">Test</button></div>'));
                pane.querySelector('#st-test').onclick = function () { SFX.boot(); };
                break;
            case 'access':
                pane.appendChild(el('div', 'card', '<div>Text size</div><div class="qs-slider" style="margin-top:8px"><span style="font-size:11px">A</span><input type="range" id="st-ts" min="12" max="18" value="' + (parseFloat(document.body.style.fontSize) || 14) + '"><span style="font-size:18px">A</span></div>'));
                pane.querySelector('#st-ts').oninput = function () { document.body.style.fontSize = this.value + 'px'; };
                pane.appendChild(toggleRow('Always show scrollbars', 'Currently follows the browser', false, function () { toast('access', 'Not in this build', 'The simulator follows the browser settings for this one.', 3000, 'Settings'); }, 'access'));
                break;
            case 'save':
                pane.innerHTML += '<div class="w-sub">Your files, wallpaper and settings are saved on this device. Copy a transfer code to move them to another device.</div>';
                pane.appendChild(toggleRow('Auto-save', autoSaveOn ? 'Changes are saved as you go' : 'Off — nothing will be kept after you leave', autoSaveOn, function (v) { setAutoSave(v); }, 'save'));
                pane.appendChild(el('div', 'card', '<div class="row"><div><div>Save now</div><small>Device ID: <span class="mono">' + esc(AndySave.deviceId()) + '</span></small></div><button class="btn" id="sv-now">Save</button></div>'));
                pane.appendChild(el('div', 'card', '<div class="row"><div><div>Transfer code</div><small>Copy this PC to another device</small></div><button class="btn" id="sv-copy">Copy code</button></div><div style="display:flex;gap:8px;margin-top:10px"><input class="inp" id="sv-in" type="text" placeholder="Paste a transfer code" style="flex:1" autocomplete="off"><button class="btn primary" id="sv-load">Load</button></div>'));
                pane.appendChild(el('div', 'card', '<div class="row"><div><div>Reset this PC</div><small>Removes all files, pictures, installed apps and settings</small></div><button class="btn danger" id="sv-reset">Reset</button></div>'));
                pane.appendChild(el('div', 'card', '<div class="row"><div><div>Play Centre</div><small>Back to the games menu</small></div><a class="btn" href="./">🏠 Home</a></div>'));
                pane.querySelector('#sv-now').onclick = function () { writeSave(); AndySave.flashButton(this, '✅ Saved!'); };
                pane.querySelector('#sv-copy').onclick = function () { const btn = this; AndySave.copyText(AndySave.makeCode('desktop', collectSave()), function (ok) { if (ok) AndySave.flashButton(btn, '✅ Copied!'); }); };
                pane.querySelector('#sv-load').onclick = function () {
                    const p = AndySave.readCode('desktop', pane.querySelector('#sv-in').value);
                    if (!p) { SFX.error(); toast('save', 'Invalid code', 'That does not look like a Desktop Simulator transfer code.', 3500, 'Settings'); return; }
                    try { localStorage.setItem(SAVE_KEY, JSON.stringify(p.d)); } catch (e) { /* fall through */ }
                    applySave(p.d); applyTheme(); applyWallpaper(); paintShell(); renderIcons(); refreshWindows();
                    toast('save', 'Loaded', 'Save from ' + p.dev + ' loaded.', 3000, 'Settings');
                };
                pane.querySelector('#sv-reset').onclick = function () {
                    dialog({ title: 'Reset this PC?', text: 'Everything you saved here will be deleted. This cannot be undone.', buttons: [{ t: 'Reset', danger: true, fn: function () { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} autoSaveOn = false; location.reload(); } }, { t: 'Cancel', primary: true }] });
                };
                break;
            case 'about':
                pane.appendChild(el('div', 'card', '<div class="about-grid"><b>Device name</b><span>Andy-PC</span><b>Processor</b><span>Intel® Core™ i9-14900KF 6.00 GHz</span><b>Installed RAM</b><span>16.0 GB</span><b>Graphics</b><span>NVIDIA GeForce RTX 5090</span><b>Storage</b><span>476 GB SSD + 1.99 TB Games (D:)</span><b>Device ID</b><span class="mono">' + esc(AndySave.deviceId()) + '</span><b>System type</b><span>64-bit operating system (browser edition)</span></div>'));
                pane.appendChild(el('div', 'card', '<div class="about-grid"><b>Edition</b><span>Windows 11 Home</span><b>Version</b><span>24H2</span><b>OS build</b><span>26100.1</span><b>Times booted</b><span>' + G.booted + '</span><b>Made for</b><span>Andy, by the Play Centre</span></div>'));
                break;
        }
    }
    w.refresh = draw; draw();
};

/* ---------------------------------------------------------- Store */
function installApp(a) {
    if (G.installed.indexOf(a.id) >= 0) return;
    G.installed.push(a.id);
    if (G.pinned.indexOf(a.id) < 0) G.pinned.push(a.id);
    saveGame(); refreshWindows(); if (smOpen) renderStart();
    toast(APPS[a.id].icon, a.name + ' installed', 'Find it in the Start menu.', 3500, 'Microsoft Store');
}
function uninstallApp(k) {
    G.installed = G.installed.filter(function (x) { return x !== k; });
    G.pinned = G.pinned.filter(function (x) { return x !== k; });
    G.tbpins = G.tbpins.filter(function (x) { return x !== k; });
    G.shortcuts = G.shortcuts.filter(function (x) { return x !== k; });
    winsFor(k).forEach(function (w) { closeWin(w.key); });
    saveGame(); refreshWindows(); renderIcons(); paintPins(); if (smOpen) renderStart();
    toast('store', APPS[k].name + ' uninstalled', '', 2500, 'Microsoft Store');
}
APPS.store.render = function (w) {
    function draw() {
        w.body.className = 'wbody';
        w.body.innerHTML = '<div class="w-h1">Microsoft Store</div><div class="w-sub">Free apps for your PC. No downloads are real, nothing leaves the browser.</div>';
        STORE_APPS.forEach(function (a) {
            const has = G.installed.indexOf(a.id) >= 0;
            const c = el('div', 'card', '<div class="row"><div class="rl">' + iconBox(APPS[a.id].icon, 'lg') + '<div><div style="font-weight:600">' + esc(a.name) + '</div><small>' + esc(a.by) + ' · ★ ' + a.stars + ' · ' + a.mb + ' MB</small><small>' + esc(a.desc) + '</small></div></div>' + (has ? '<button class="btn" data-open="' + a.id + '">Open</button>' : '<button class="btn primary" data-get="' + a.id + '">Get</button>') + '</div><div class="meter" style="display:none"><i style="width:0"></i></div>');
            const g = c.querySelector('[data-get]');
            if (g) g.onclick = function () {
                g.disabled = true; g.textContent = 'Installing…';
                const m = c.querySelector('.meter'); m.style.display = 'block';
                let p = 0;
                const iv = setInterval(function () { p += 6 + Math.random() * 10; m.firstChild.style.width = Math.min(100, p) + '%'; if (p >= 100) { clearInterval(iv); installApp(a); } }, 120);
            };
            const o = c.querySelector('[data-open]');
            if (o) o.onclick = function () { openWin(a.id); };
            w.body.appendChild(c);
        });
    }
    w.refresh = draw; draw();
};

/* ---------------------------------------------------------- Task Manager */
APPS.taskmgr.render = function (w) {
    let sel = null;
    function draw() {
        w.body.className = 'wbody';
        const wins = Object.keys(WINS).map(function (k) { return WINS[k]; });
        const sys = [['System', 0.4, 128], ['Desktop Window Manager', 1.2, 84], ['Windows Explorer', 0.8, 112], ['Antimalware Service Executable', 2.1, 198], ['Play Centre Runtime', 0.3, 41]];
        let html = '<div class="w-h1">Task Manager</div><div class="w-sub">Processes · CPU ' + (4 + wins.length * 3) + '% · Memory ' + (34 + wins.length * 2) + '%</div>' +
            '<div class="proc-head" style="display:flex;gap:10px;padding:0 9px 6px;font-size:11px;color:var(--txt2);border-bottom:1px solid var(--stroke);margin-bottom:5px"><span style="flex:1">Name</span><span style="width:58px;text-align:right">CPU</span><span style="width:70px;text-align:right">Memory</span></div>';
        html += '<div style="font-size:11px;font-weight:600;color:var(--txt2);padding:4px 9px">Apps (' + wins.length + ')</div>';
        w.body.innerHTML = html;
        wins.forEach(function (x) {
            const r = el('button', 'row', '<span class="rl" style="flex:1">' + iconBox(x.def.icon, 'xs') + esc(x.title.textContent) + '</span><span style="width:58px;text-align:right;color:var(--txt2)">' + (x === activeWin ? '2.4' : '0.' + ((x.key.length * 7) % 9)) + '%</span><span style="width:70px;text-align:right;color:var(--txt2)">' + (40 + (x.key.length * 13) % 90) + ' MB</span>');
            r.style.cssText = 'width:100%;padding:7px 9px;border-radius:4px;font-size:12.5px;text-align:left;' + (sel === x.key ? 'background:var(--sel)' : '');
            r.onclick = function () { sel = x.key; draw(); };
            w.body.appendChild(r);
        });
        w.body.appendChild(el('div', '', '<div style="font-size:11px;font-weight:600;color:var(--txt2);padding:8px 9px 4px">Background processes (' + sys.length + ')</div>' + sys.map(function (s) { return '<div class="row" style="padding:6px 9px;font-size:12.5px"><span style="flex:1">' + s[0] + '</span><span style="width:58px;text-align:right;color:var(--txt2)">' + s[1] + '%</span><span style="width:70px;text-align:right;color:var(--txt2)">' + s[2] + ' MB</span></div>'; }).join('')));
        const b = el('button', 'btn', 'End task');
        b.style.cssText = 'margin-top:12px;align-self:flex-end';
        b.disabled = !sel || !WINS[sel];
        b.onclick = function () { if (sel && WINS[sel]) { const k = sel; sel = null; if (WINS[k].beforeClose) WINS[k].beforeClose = null; closeWin(k); } };
        w.body.appendChild(b);
    }
    w.refresh = draw; draw();
    const iv = setInterval(function () { if (!WINS[w.key]) { clearInterval(iv); return; } draw(); }, 2500);
};

/* ---------------------------------------------------------- Snake (Store) */
APPS.snake.render = function (w) {
    w.body.className = 'wbody flush';
    w.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;flex:1;background:var(--mica)"><div class="row" style="width:100%;max-width:360px"><b>Snake</b><span id="sn-score">Score 0</span></div><canvas id="sn-cv" width="360" height="360" style="background:#0f2a12;border-radius:6px;max-width:100%;touch-action:none"></canvas><div style="font-size:12px;color:var(--txt2)">Arrow keys / WASD, or swipe. Space to restart.</div></div>';
    const cv = w.body.querySelector('#sn-cv'), ctx = cv.getContext('2d'), N = 18, S = cv.width / N;
    let snake, dir, next, food, score, dead, timer;
    function reset() { snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }]; dir = { x: 1, y: 0 }; next = dir; score = 0; dead = false; place(); }
    function place() { do { food = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 }; } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; })); }
    function step() {
        if (dead) return;
        dir = next;
        const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function (s) { return s.x === h.x && s.y === h.y; })) { dead = true; SFX.error(); toast('game', 'Game over', 'Score ' + score + '. Press Space to play again.', 3500, 'Snake'); draw(); return; }
        snake.unshift(h);
        if (h.x === food.x && h.y === food.y) { score += 10; SFX.click(); place(); } else snake.pop();
        w.body.querySelector('#sn-score').textContent = 'Score ' + score;
        draw();
    }
    function draw() {
        ctx.fillStyle = '#0f2a12'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2.4, 0, Math.PI * 2); ctx.fill();
        snake.forEach(function (s, i) { ctx.fillStyle = i ? '#5fd38a' : '#b9ffd0'; ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2); });
        if (dead) { ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.fillStyle = '#fff'; ctx.font = '600 24px ' + getComputedStyle(document.body).fontFamily; ctx.textAlign = 'center'; ctx.fillText('Game over — ' + score, cv.width / 2, cv.height / 2); }
    }
    function turn(x, y) { if (x === -dir.x && y === -dir.y) return; next = { x: x, y: y }; }
    w.node.tabIndex = -1;
    w.node.addEventListener('keydown', function (e) {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'w') turn(0, -1); else if (k === 'arrowdown' || k === 's') turn(0, 1); else if (k === 'arrowleft' || k === 'a') turn(-1, 0); else if (k === 'arrowright' || k === 'd') turn(1, 0);
        else if (k === ' ') { if (dead) reset(); } else return;
        e.preventDefault();
    });
    let t0 = null;
    cv.addEventListener('pointerdown', function (e) { t0 = { x: e.clientX, y: e.clientY }; if (dead) reset(); });
    cv.addEventListener('pointerup', function (e) { if (!t0) return; const dx = e.clientX - t0.x, dy = e.clientY - t0.y; if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else if (dy) turn(0, dy > 0 ? 1 : -1); t0 = null; });
    reset(); draw();
    timer = setInterval(function () { if (!WINS[w.key]) { clearInterval(timer); return; } step(); }, 130);
    w.onClose = function () { clearInterval(timer); };
    setTimeout(function () { w.node.focus(); }, 60);
};

};

/* ===================================================== LOCK / POWER / BOOT */
let locked = false;
function lockScreen() {
    closeFlyouts();
    locked = true;
    $('lock').classList.remove('login');
    $('lock').classList.add('on');
    tickClock();
}
function unlock() {
    locked = false;
    $('lock').classList.remove('on');
    $('lock').classList.remove('login');
    SFX.pop();
}
$('lock').onclick = function (e) {
    if (e.target.closest('.lk-user')) return;
    $('lock').classList.add('login');
};
$('lk-go').onclick = function (e) { e.stopPropagation(); unlock(); };
window.addEventListener('keydown', function (e) {
    if (!locked) return;
    if (!$('lock').classList.contains('login')) { $('lock').classList.add('login'); return; }
    if (e.key === 'Enter') unlock();
});
function sleepPC() {
    lockScreen();
    $('dimmer').style.transition = 'opacity 1.2s';
    $('dimmer').style.opacity = '0.9';
    setTimeout(function () { $('dimmer').style.transition = 'opacity 0.3s'; applyTheme(); }, 2400);
    toast('moon', 'Sleeping…', 'The PC went to sleep. Click to wake it up.', 2000);
}
function shutDown() {
    writeSave();
    closeFlyouts();
    $('desktop').classList.remove('on');
    setTimeout(function () {
        Object.keys(WINS).forEach(function (k) { WINS[k].node.remove(); delete WINS[k]; });
        activeWin = null; paintPins();
        $('off').classList.add('on');
        $('off').classList.remove('gone');
    }, 650);
}
function restartPC() {
    writeSave();
    $('desktop').classList.remove('on');
    setTimeout(function () { location.reload(); }, 600);
}
$('off-btn').onclick = function () {
    $('off').classList.add('gone');
    setTimeout(function () { $('off').classList.remove('on'); }, 500);
    booted = false;
    $('boot').style.display = '';
    $('boot').classList.remove('gone');
    setTimeout(bootDone, 2200);
};

(function makeSpinner() {
    const s = $('boot-spin');
    for (let i = 0; i < 6; i++) { const d = el('i'); d.style.animationDelay = (i * 0.14) + 's'; s.appendChild(d); }
})();

let booted = false;
const sessionStart = Date.now();
function bootDone() {
    if (booted) return;
    booted = true;
    $('boot').classList.add('gone');
    setTimeout(function () { $('boot').style.display = 'none'; }, 600);
    $('desktop').classList.add('on');
    G.booted++;
    saveGame();
    SFX.boot();
    if (G.booted <= 1) {
        setTimeout(function () { toast('user', 'Welcome, ' + G.name, 'Right-click the desktop, open the Start menu, or try dragging a window to the edge of the screen.', 7000, 'Get Started'); }, 900);
        setTimeout(function () { toast('paint', 'Make it yours', 'Open Settings > Personalisation to change the background, or draw one in Paint.', 7000, 'Tips'); }, 5200);
    } else {
        setTimeout(function () { toast('user', 'Welcome back, ' + G.name, 'Everything is where you left it.', 3500); }, 900);
    }
}
$('boot').onclick = bootDone;

/* ====================================================================== INIT */
loadGame();
applyTheme();
applyWallpaper();
paintShell();
renderIcons();
tickClock();
setInterval(tickClock, 10000);
setTimeout(bootDone, 2600);
IDB.get('wallpaper').then(function (blob) {
    if (blob && blob instanceof Blob) {
        customWallpaperUrl = URL.createObjectURL(blob);
        if (G.wp === 'custom') applyWallpaper();
    } else if (G.wp === 'custom') { G.wp = 'bloom'; applyWallpaper(); }
});
window.addEventListener('pagehide', writeSave);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') writeSave(); });
</script>
